thesis:
  kicker: University project · Schema matching & data integration
  title: Two hospitals, one patient, slightly different codes.
  paragraphs:
    - >-
      Hospitals store the same kinds of information in different databases, with different column
      names. To combine them you first need to know which column in one corresponds to which in the
      other. That is schema matching. A common way to do it is to look at the values: if two columns
      contain the same things, they probably mean the same thing.
    - >-
      Clinical data makes this harder. Diagnoses are stored as codes from huge medical vocabularies,
      and real-world coding errors are rarely random. Someone records "chronic kidney disease, stage 5"
      when it was stage 4: a neighbouring concept, not a typo. To an exact comparison those two are
      as different as "kidney disease" and "broken arm".
    - >-
      The project treats the vocabulary as what it is, a hierarchy. Two codes are similar if they are
      close in that tree. I built a way to generate realistic near-miss errors on OMOP-CDM data and a
      matcher that compares values by meaning instead of by spelling, then measured both against
      exact matching on the Valentine benchmark framework.
  demoTitle: Try it
  demoNote: >-
    Toy example to show the idea, not project results. Raise the noise: exact matching loses the
    diagnosis columns, semantic matching keeps them.
  link: The code behind it

method:
  intro: >-
    How I approach a data or ML problem. These aren't rules I read somewhere: each one comes
    from a mistake I made or caught in my own projects.
  steps:
    - title: Decide what "right" means first
      text: >-
        Pick the metric from the decision it supports, before touching a model. With 11% positives,
        accuracy rewards doing nothing, so in the readmission project the metric is AUC-PR and the
        threshold comes from expected cost.
    - title: Look for the silent errors in the data
      text: >-
        The expensive bugs don't crash. A "None" that means "test not ordered", patients who cannot
        be readmitted, a parser that quietly returns 114 units instead of 586. I look for them before
        I train anything.
    - title: Build the weak baseline
      text: >-
        A simple baseline tells you what the clever part is worth. In the RAG project it showed that
        retrieval and final accuracy come apart, which I would have missed otherwise.
    - title: Measure the claim, not the vibe
      text: >-
        Paired comparisons, confidence intervals, held-out probes for thresholds. If a design can't
        answer the question, change the design. That's how "the protocol matters" turned into a
        rejected hypothesis.
    - title: Write the limits next to the results
      text: >-
        Every project ends with what it can't do. A recruiter reading a negative MOTA deserves the
        explanation in the same place as the number.
  ai:
    title: How I use AI at work
    paragraphs:
      - >-
        I use Claude Code every day as a pair programmer: to read unfamiliar code, scaffold the boring
        parts, write tests and challenge my reasoning. I keep the decisions: what to build, what to
        measure and when something is wrong.
      - >-
        Concretely, that means small reviewed diffs instead of big generated dumps, asking for the
        failure cases explicitly, and verifying numbers against the source rather than trusting a
        summary. This site was built that way too, with every figure checked against the repositories.
    principles:
      - AI speeds up the typing, not the judgement.
      - If I can't explain a line, it doesn't ship.
      - Evaluate LLM features like any other model.

